name: Publish Sabuflix Web
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --release --no-pub --base-href /sabuflixonweb/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build/web
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4